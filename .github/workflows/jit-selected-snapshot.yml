name: Selected JIT snapshot diagnostics

on:
  push:
    branches: [experiments/quake-selected-jit-snapshots]
  pull_request:
    paths:
      - 'src/cpu/jit_selected_snapshot.h'
      - 'src/cpu/core_dyn_x86.cpp'
      - 'src/cpu/core_dyn_x86/decoder.h'
      - 'extras/guest-block-mapping/test_jit_selected_snapshot.cpp'
      - '.github/workflows/jit-selected-snapshot.yml'

permissions:
  contents: read

jobs:
  selected-snapshot-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile C++ snapshot module standalone with warnings as errors
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            extras/guest-block-mapping/test_jit_selected_snapshot.cpp \
            -o /tmp/test-jit-selected-snapshot
          /tmp/test-jit-selected-snapshot
      - name: Keep previous lifecycle analyzer regression coverage
        run: |
          python3 -m unittest discover -s extras/guest-block-mapping -p test_analyze_trace.py -v
